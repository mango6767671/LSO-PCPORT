name: PC Port CI

on:
  push:
    branches: [main]
    paths:
      - "src/pcPort/**"
      - "tests/pc-port/**"
      - "prisma/schema.prisma"
      - "src/main.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pc-port-ci.yml"
  pull_request:
    paths:
      - "src/pcPort/**"
      - "tests/pc-port/**"
      - "prisma/schema.prisma"
      - "src/main.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pc-port-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run PC-port tests
        run: npm test
      - name: Validate Prisma schema and JavaScript syntax
        run: npm run validate
